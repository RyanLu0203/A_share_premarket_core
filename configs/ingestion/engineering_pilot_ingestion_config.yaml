  },
  "benchmark_symbols": ["000300"],
  "adjustment_policy": "qfq",
  "local_storage_format_priority": ["parquet", "csv"],
  "fallback_storage_format": "csv",
  "heavy_data_git_exclusion_policy": "local_bundle_only",
  "failure_classification_policy": "configs/providers/provider_failure_classification.yaml"

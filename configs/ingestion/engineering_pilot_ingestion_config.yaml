{
  "config_id": "goal06c6_engineering_pilot_ingestion",
  "network_enabled_policy": "disabled_by_default_env_or_cli_opt_in",
  "symbol_target_count": 50,
  "candidate_symbol_count": 100,
  "raw_history_trading_dates": 180,
  "validation_trading_dates": 120,

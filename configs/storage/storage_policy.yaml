{
  "policy_id": "goal06c5_local_research_storage_policy",
  "storage_kind": "local_research_store_not_production_database",
  "data_root_env_var": "ASHARE_PREMARKET_DATA_ROOT",
  "default_data_root": "~/data/ashare_premarket/",
  "data_root_must_be_outside_repo": true,
  "network_ingestion_default": "disabled",
  "allowed_github_artifacts": [
    "code",
    "configs",
    "schemas",
    "small_sample_fixtures",
    "manifest_summaries",
    "coverage_summaries",
    "audit_reports",
    "readiness_reports",
    "workflow_docs"
  ],
  "forbidden_github_artifacts": [
    "*.duckdb",
    "*.sqlite",
    "*.sqlite3",
    "*.db",
    "*.parquet",
    "*.feather",
    "*.arrow",
    "*.pkl",
    "*.joblib",
    "*.zip",
    "*.raw",
    "*.payload",
    "*.html",
    "*.log",
    "raw_provider_payloads",
    "local_data_lake",
    "local_bundles",
    "full_announcement_body_text",
    "notebooks",
    "production_model_artifacts"
  ],
  "local_directory_contract": [
    "raw/akshare",
    "raw/eastmoney",
    "raw/cninfo",
    "raw/sina",
    "bundles/engineering_pilot/<bundle_id>",
    "lake/ohlcv_daily",
    "lake/benchmark_daily",
    "lake/announcements_metadata",
    "lake/source_coverage",
    "lake/pit_signal_panel",
    "lake/label_panel",
    "lake/stage6c_engineering_panel",
    "metadata/schema_registry",
    "exports/github_artifacts",
    "exports/audit_samples"
  ]
}

{
  "policy_id": "goal06c5_goal06c6_local_research_storage_policy",
  "storage_kind": "local_research_store_not_production_database",
  "data_root_env_var": "ASHARE_PREMARKET_DATA_ROOT",
  "default_data_root": "~/data/ashare_premarket/",
  "default_data_root_policy": "documentation_only_for_goal_storage01; future heavy writes require ASHARE_PREMARKET_DATA_ROOT",
  "data_root_must_be_outside_repo": true,
  "network_ingestion_default": "disabled",
  "network_ingestion_opt_in": "ASHARE_ALLOW_NETWORK_INGESTION=1 or --allow-network",
  "provider_bypass_policy": "browser-reference probes require explicit opt-in and may write only sanitized metadata; captcha solving, credential harvesting, proxy rotation, raw HTML storage, and payload body commits remain forbidden",
  "browser_assisted_ingestion_policy": {
    "project_default": false,
    "explicit_opt_in": "ASHARE_ENABLE_BROWSER_ASSISTED_PROVIDER=1 plus --enable-browser-assisted",
    "temporary_venv_allowed": true,
    "temporary_cache_outside_repo": true,
    "temporary_cache_cleaned_by_default": true,
    "raw_browser_artifacts_forbidden_in_git": true,
    "domain_access_only_not_counted_as_ingestion": true
  },
  "allowed_github_artifacts": [
    "code",
    "configs",
    "schemas",
    "small_sample_fixtures",
    "manifest_summaries",
    "coverage_summaries",
    "audit_reports",
    "readiness_reports",
    "workflow_docs"
  ],
  "forbidden_github_artifacts": [
    "*.duckdb",
    "*.sqlite",
    "*.sqlite3",
    "*.db",
    "*.parquet",
    "*.feather",
    "*.arrow",
    "*.pkl",
    "*.joblib",
    "*.onnx",
    "*.pt",
    "*.pth",
    "*.h5",
    "*.npy",
    "*.npz",
    "*.csv.gz",
    "*.zip",
    "*.raw",
    "*.payload",
    "*.html",
    "*.log",
    "raw_provider_payloads",
    "local_data_lake",
    "local_bundles",
    "full_announcement_body_text",
    "notebooks",
    "production_model_artifacts"
  ],
  "local_directory_contract": [
    "raw/akshare",
    "raw/eastmoney",
    "raw/cninfo",
    "raw/sina",
    "bundles/engineering_pilot/<bundle_id>",
    "lake/ohlcv_daily",
    "lake/benchmark_daily",
    "lake/announcements_metadata",
    "lake/source_coverage",
    "lake/pit_signal_panel",
    "lake/label_panel",
    "lake/stage6c_engineering_panel",
    "metadata/schema_registry",
    "exports/github_artifacts",
    "exports/audit_samples",
    "bundles/engineering_pilot/goal06c6_akshare_engineering_pilot_current"
    ,"bundles/engineering_pilot/goal06c7_provider_ladder_engineering_pilot_current"
  ]
}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-premarket-core"
version = "0.1.0"
description = "Governed read-only A-share premarket data, evidence, risk, workspace, and research system"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
data = [
  "akshare==1.18.64",
  "pandas",
  "pyarrow",
  "duckdb",
]
test = [
  "httpx>=0.27,<0.29",
  "httpx2>=2.7,<3",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
